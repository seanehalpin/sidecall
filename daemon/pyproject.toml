[project]
name = "sidecall"
version = "0.1.0"
description = "Sidecall daemon: voice- and pointer-driven prototyping through Claude Code"
authors = [
    { name = "Sean Halpin", email = "seanehalpin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.164",
    "en-core-web-sm>=3.8.0",
    "espeakng-loader>=0.2.4",
    "misaki>=0.9.4",
    "mlx-audio[tts]>=0.5.8",
    "num2words>=0.5.14",
    "parakeet-mlx>=0.5.3",
    "phonemizer-fork>=3.3.2",
    "pipecat-ai[silero,webrtc]>=1.12.0",
    "pydantic>=2.13.5",
    "spacy>=3.8.16",
    "starlette>=1.7.0",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sidecall = "sidecall.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The spoken/pick formats (SPEC §6.9) use the multiplication sign on purpose.
"src/sidecall/prompts.py" = ["RUF001"]
"tests/test_picks.py" = ["RUF001"]
"tests/test_prompts.py" = ["RUF001"]
"tests/test_server.py" = ["RUF001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: talks to Claude Code (costs usage); run with --integration",
    "voice: loads the voice models and runs the pipeline headless (slow); run with --voice",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
